name: Health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://pokedex-8rav.onrender.com/
          max-attempts: 5
          retry-delay: 30s
          retry-all: true
